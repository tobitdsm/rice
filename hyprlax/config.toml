# Cursor-driven parallax with single layer
[global]
fps = 144
debug = false
duration = 0.5
vsync = false
easing = "quad"

[global.parallax.invert.cursor]
x = true               # Layers move opposite to cursor
y = false

[global.parallax.max_offset_px]
x = 300
y = 150

[global.input.cursor]
follow_global = true
sensitivity_x = 1.0
sensitivity_y = 0.8
deadzone_px = 5
ema_alpha = 0.3        # Smooth cursor movement
animation_duration = 2.0
easing = "expo"

# Background layer - moves slowly
[[global.layers]]
path = "../../Pictures/EIA-full-rescaled.png"
shift_multiplier = 1.0
scale = 1.0
fit = "cover"
align = { x = 0, y = 0.5 }